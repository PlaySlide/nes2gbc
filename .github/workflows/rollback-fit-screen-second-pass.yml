name: Roll back fit-screen second pass

on:
  push:
    branches:
      - chatgpt/rollback-fit-screen-second-pass

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fit-screen-scale
          fetch-depth: 0
      - name: Restore first-pass fit-screen state
        run: python3 .chatgpt/rollback_second.py
      - name: Validate diff
        run: |
          git diff --check
          git diff -- runtime/main.asm runtime/video.asm
      - name: Run tests
        run: cargo test --quiet
      - name: Commit rollback
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add runtime/main.asm runtime/video.asm
          git commit -m "FIT_SCREEN: roll back regressing second-pass changes"
          git push origin HEAD:feat/fit-screen-scale
