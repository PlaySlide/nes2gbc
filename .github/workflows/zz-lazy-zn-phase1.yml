name: Apply lazy ZN phase 1

on:
  push:
    branches: [perf/branch-fusion]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/branch-fusion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply conservative resident-A lazy Z/N
        run: python3 tools/apply_lazy_zn_phase1.py
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --all-targets
      - name: Check
        run: cargo check --all-targets
      - name: Generate synthetic ROM
        run: python3 tools/make_smoke_rom.py /tmp/nes2gbc-smoke.nes
      - name: Smoke generated ASM
        run: make generate ROM=/tmp/nes2gbc-smoke.nes MAX_BLOCKS=16
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/state_superblock.rs
          git diff --cached --quiet && exit 1
          git commit -m "Defer resident-A Z/N publication within blocks"
          git push origin HEAD:perf/branch-fusion
