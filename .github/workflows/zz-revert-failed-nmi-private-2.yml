name: Temporary revert failed NMI-private experiment 2

on:
  push:
    branches:
      - perf/branch-fusion
    paths:
      - .github/workflows/zz-revert-failed-nmi-private-2.yml

permissions:
  contents: write

jobs:
  revert-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/branch-fusion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Revert failed NMI-private source experiment
        run: git revert --no-edit ee8b696e98807f16bb4eb569eb9a51a70a5cfb7c
      - name: Remove temporary experiment plumbing
        run: |
          rm -f tools/narrow_nmi_private.py
          rm -f .github/workflows/zz-narrow-nmi-private.yml
          rm -f .github/workflows/zz-revert-failed-nmi-private.yml
          rm -f .github/workflows/zz-revert-failed-nmi-private-2.yml
      - name: Test
        run: cargo test --all-targets
      - name: Check
        run: cargo check --all-targets
      - name: Generate synthetic NES ROM
        run: python3 tools/make_smoke_rom.py /tmp/nes2gbc-smoke.nes
      - name: Recompile generated ASM
        run: make generate ROM=/tmp/nes2gbc-smoke.nes MAX_BLOCKS=16
      - name: Reject duplicate generated labels
        run: |
          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          labels=[]
          for line in Path('runtime/generated.asm').read_text().splitlines():
              m=re.match(r'^\s*([A-Za-z_][A-Za-z0-9_]*):\s*$', line)
              if m:
                  labels.append(m.group(1))
          dup=[k for k,v in Counter(labels).items() if v>1]
          assert not dup, f'duplicate labels: {dup[:20]}'
          print('duplicate-label scan: ok')
          PY
      - name: Assemble generated GBC ROM with RGBDS
        run: docker run --rm -v "$PWD/runtime:/work" -w /work ghcr.io/gbdev/rgbds:latest make
      - name: Commit cleanup and push
        run: |
          git add -A
          git commit -m "Remove temporary NMI-private experiment plumbing"
          git push origin HEAD:perf/branch-fusion
