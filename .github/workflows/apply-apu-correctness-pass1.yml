name: Apply APU correctness pass 1

on:
  push:
    branches:
      - apu/correctness-pass-1

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apu/correctness-pass-1
      - uses: dtolnay/rust-toolchain@stable

      - name: Apply focused APU fixes
        run: python3 tools/apply_apu_correctness_pass1.py

      - name: Rust tests
        run: cargo test --all-targets

      - name: Rust check
        run: cargo check --all-targets

      - name: End-to-end RGBDS build
        run: |
          python3 tools/make_smoke_rom.py /tmp/nes2gbc-smoke.nes
          cargo run -- /tmp/nes2gbc-smoke.nes --emit-asm runtime/generated.asm --max-blocks 16
          docker run --rm -v "$PWD/runtime:/work" -w /work ghcr.io/gbdev/rgbds:latest make
          test -s runtime/build/runtime.gbc

      - name: Commit source change and remove one-shot helpers
        run: |
          rm tools/apply_apu_correctness_pass1.py
          rm .github/workflows/apply-apu-correctness-pass1.yml
          git checkout -- runtime/generated.asm
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/apu.asm tools/apply_apu_correctness_pass1.py .github/workflows/apply-apu-correctness-pass1.yml
          git commit -m "Fix NES APU status, length, sweep, and noise semantics"
          git push origin HEAD:apu/correctness-pass-1
