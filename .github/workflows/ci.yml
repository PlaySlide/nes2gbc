name: Apply compare fixture fix

on: push

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fix fixture, verify, and push
        run: |
          python3 -c "from pathlib import Path; p=Path('src/state_superblock.rs'); s=p.read_text(); old='[0xA2, 0x04, 0xE0, 0x03, 0xD0, 0x02, 0xEA, 0x60, 0xEA]'; new='[0xA2, 0x04, 0xE0, 0x03, 0xD0, 0x02, 0xEA, 0x60, 0x60]'; assert old in s; p.write_text(s.replace(old,new,1))"
          cargo test --all-targets
          cargo check --all-targets
          git config user.name nes2gbc-bot
          git config user.email actions@users.noreply.github.com
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git add src/state_superblock.rs .github/workflows/ci.yml
          git commit -m 'Fix stateful compare regression fixture'
          git push origin HEAD:perf/branch-fusion
