name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-targets
      - name: Check
        run: cargo check --all-targets

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate synthetic NES ROM
        run: python3 tools/make_smoke_rom.py /tmp/nes2gbc-smoke.nes
      - name: Recompile and run generated-ASM optimization pipeline
        run: make generate ROM=/tmp/nes2gbc-smoke.nes MAX_BLOCKS=16
      - name: Assemble generated GBC ROM with RGBDS
        run: docker run --rm -v "$PWD/runtime:/work" -w /work ghcr.io/gbdev/rgbds:latest make
      - name: Verify ROM exists
        run: test -s runtime/build/runtime.gbc
      - name: Generate synthetic UxROM NES ROM
        run: python3 tools/make_mapper2_smoke_rom.py /tmp/nes2gbc-mapper2-smoke.nes
      - name: Recompile UxROM and run generated-ASM optimization pipeline
        run: make generate ROM=/tmp/nes2gbc-mapper2-smoke.nes
      - name: Assemble generated UxROM GBC ROM with RGBDS
        run: docker run --rm -v "$PWD/runtime:/work" -w /work ghcr.io/gbdev/rgbds:latest make clean all
      - name: Verify UxROM ROM exists
        run: test -s runtime/build/runtime.gbc
