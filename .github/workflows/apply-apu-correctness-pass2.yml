name: Apply APU correctness pass 2

on:
  push:
    branches:
      - apu/correctness-pass-2
    paths:
      - tools/apply_apu_correctness_pass2.py
      - .github/workflows/apply-apu-correctness-pass2.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apu/correctness-pass-2
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply focused APU fixes
        run: python3 tools/apply_apu_correctness_pass2.py

      - name: Check patch formatting
        run: git diff --check

      - name: Rust tests
        run: cargo test --all-targets

      - name: Rust check
        run: cargo check --all-targets

      - name: End-to-end RGBDS build
        run: |
          python3 tools/make_smoke_rom.py /tmp/nes2gbc-smoke.nes
          cargo run -- /tmp/nes2gbc-smoke.nes --emit-asm runtime/generated.asm --max-blocks 16
          docker run --rm -v "$PWD/runtime:/work" -w /work ghcr.io/gbdev/rgbds:latest make clean all
          test -s runtime/build/runtime.gbc

      - name: Commit source change and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/apu.asm
          git rm tools/apply_apu_correctness_pass2.py .github/workflows/apply-apu-correctness-pass2.yml
          git commit -m "Improve NES APU frame and triangle timing semantics"
          git push origin HEAD:apu/correctness-pass-2
