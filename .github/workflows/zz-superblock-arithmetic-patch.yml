name: Apply stateful arithmetic patch

on:
  push:
    branches: [perf/branch-fusion]
    paths: [.github/workflows/zz-superblock-arithmetic-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage stateful arithmetic emitter patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/branch-fusion
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Add stateful ADC/SBC emission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/state_superblock.rs')
          s = p.read_text()

          old = '    ir::{self, Flag, IrOp, LogicOp, ModifyOp, ModifyTarget, Operand, Register},\n'
          new = '    ir::{self, ArithmeticOp, Flag, IrOp, LogicOp, ModifyOp, ModifyTarget, Operand, Register},\n'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    fast_ops: usize,
    fast_compares: usize,
    barriers: usize,'''
          new = '''    fast_ops: usize,
    fast_compares: usize,
    fast_arithmetic: usize,
    barriers: usize,'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        IrOp::Logic { rhs: Operand::Immediate(_), .. } => true,
        IrOp::Compare { reg, rhs } => reg != Register::Sp && fast_operand_supported(rhs),'''
          new = '''        IrOp::Logic { rhs: Operand::Immediate(_), .. } => true,
        IrOp::Arithmetic { rhs, .. } => fast_operand_supported(rhs),
        IrOp::Compare { reg, rhs } => reg != Register::Sp && fast_operand_supported(rhs),'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        IrOp::Logic { op, rhs: Operand::Immediate(imm) } => {
            writeln!(out, "    ldh a, [nes_a]").unwrap();
            match op {
                LogicOp::And => writeln!(out, "    and ${imm:02X}").unwrap(),
                LogicOp::Ora => writeln!(out, "    or ${imm:02X}").unwrap(),
                LogicOp::Eor => writeln!(out, "    xor ${imm:02X}").unwrap(),
            }
            writeln!(out, "    ldh [nes_a], a").unwrap();
            emit_update_nz(out);
        }
        IrOp::Modify { op: modify, target } => {'''
          new = '''        IrOp::Logic { op, rhs: Operand::Immediate(imm) } => {
            writeln!(out, "    ldh a, [nes_a]").unwrap();
            match op {
                LogicOp::And => writeln!(out, "    and ${imm:02X}").unwrap(),
                LogicOp::Ora => writeln!(out, "    or ${imm:02X}").unwrap(),
                LogicOp::Eor => writeln!(out, "    xor ${imm:02X}").unwrap(),
            }
            writeln!(out, "    ldh [nes_a], a").unwrap();
            emit_update_nz(out);
        }
        IrOp::Arithmetic { op, rhs } => {
            // Keep B/C reserved for resident X/Y. D/E/H/L are scratch here;
            // any effective-address use is complete before arithmetic begins.
            match rhs {
                Operand::Immediate(imm) => {
                    writeln!(out, "    ld e, ${imm:02X}").unwrap();
                }
                _ => {
                    emit_operand_load(out, rhs, state, stats);
                    writeln!(out, "    ld e, a ; superblock arithmetic RHS").unwrap();
                }
            }
            if op == ArithmeticOp::Sbc {
                // 6502 SBC is A + (~rhs) + C; using complemented E lets the
                // ADC overflow identity below match SBC exactly as well.
                writeln!(out, "    ld a, e").unwrap();
                writeln!(out, "    cpl").unwrap();
                writeln!(out, "    ld e, a").unwrap();
            }

            writeln!(out, "    ldh a, [nes_a]").unwrap();
            writeln!(out, "    ld d, a ; superblock arithmetic lhs").unwrap();
            writeln!(out, "    ldh a, [nes_c_shadow]").unwrap();
            writeln!(out, "    and a").unwrap();
            writeln!(out, "    jr z, :+").unwrap();
            writeln!(out, "    scf").unwrap();
            writeln!(out, "    jr :++").unwrap();
            writeln!(out, ":").unwrap();
            writeln!(out, "    and a").unwrap();
            writeln!(out, ":").unwrap();
            writeln!(out, "    ld a, d").unwrap();
            writeln!(out, "    adc e ; superblock fast {}", if op == ArithmeticOp::Adc { "ADC" } else { "SBC" }).unwrap();
            writeln!(out, "    ld l, a ; arithmetic result").unwrap();

            // Capture 6502 carry before any flag-clobbering status work.
            writeln!(out, "    ld a, $00").unwrap();
            writeln!(out, "    jr nc, :+").unwrap();
            writeln!(out, "    inc a").unwrap();
            writeln!(out, ":").unwrap();
            writeln!(out, "    ldh [nes_c_shadow], a").unwrap();

            // Only V remains material in nes_p. For SBC, E is ~rhs, so the
            // normal ADC identity ~(lhs^E)&(lhs^result) becomes the SBC
            // identity (lhs^rhs)&(lhs^result).
            writeln!(out, "    ldh a, [nes_p]").unwrap();
            writeln!(out, "    and $BF").unwrap();
            writeln!(out, "    ldh [nes_p], a").unwrap();
            writeln!(out, "    ld a, d").unwrap();
            writeln!(out, "    xor e").unwrap();
            writeln!(out, "    cpl").unwrap();
            writeln!(out, "    ld h, a").unwrap();
            writeln!(out, "    ld a, d").unwrap();
            writeln!(out, "    xor l").unwrap();
            writeln!(out, "    and h").unwrap();
            writeln!(out, "    and $80").unwrap();
            writeln!(out, "    jr z, :+").unwrap();
            writeln!(out, "    ldh a, [nes_p]").unwrap();
            writeln!(out, "    or $40").unwrap();
            writeln!(out, "    ldh [nes_p], a").unwrap();
            writeln!(out, ":").unwrap();

            writeln!(out, "    ld a, l").unwrap();
            writeln!(out, "    ldh [nes_a], a").unwrap();
            emit_update_nz(out);
            stats.fast_arithmetic += 1;
        }
        IrOp::Modify { op: modify, target } => {'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        "superblock-state: avoided {} X + {} Y HRAM reload(s); deferred {} X + {} Y canonical store(s); materialized {} X + {} Y at barriers/side exits; cached indexed uses X={} Y={}; seeds X={} Y={}; fast ops {} ({} compares); barriers {}; canonical adapters {}",'''
          new = '''        "superblock-state: avoided {} X + {} Y HRAM reload(s); deferred {} X + {} Y canonical store(s); materialized {} X + {} Y at barriers/side exits; cached indexed uses X={} Y={}; seeds X={} Y={}; fast ops {} ({} compares, {} ADC/SBC); barriers {}; canonical adapters {}",'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        stats.fast_ops,
        stats.fast_compares,
        stats.barriers,'''
          new = '''        stats.fast_ops,
        stats.fast_compares,
        stats.fast_arithmetic,
        stats.barriers,'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    fn compare_keeps_dirty_x_resident_until_real_control_barrier() {
        let mut prg = vec![0xEA; 0x8000];
        // LDX #$04 / CPX #$03 / BNE $8008 / NOP / RTS / NOP / RTS.
        prg[0..9].copy_from_slice(&[0xA2, 0x04, 0xE0, 0x03, 0xD0, 0x02, 0xEA, 0x60, 0x60]);
        let graph = cfg::discover(0, &prg, &[0x8000]).unwrap();
        let asm = emit_cfg_with_interrupts(
            &graph,
            EmitOptions { reset: 0x8000, max_blocks: Some(8), debug_trace: false },
            0x8000,
            0x8000,
        );
        let compare = asm.find("; $8002: $E0 Cpx Immediate").unwrap();
        let branch = asm.find("; $8004: $D0 Bne Relative").unwrap();
        let between = &asm[compare..branch];
        assert!(between.contains("superblock compare cached X"));
        assert!(between.contains("superblock fast compare"));
    }
}'''
          new = '''    fn compare_keeps_dirty_x_resident_until_real_control_barrier() {
        let mut prg = vec![0xEA; 0x8000];
        // LDX #$04 / CPX #$03 / BNE $8008 / NOP / RTS / NOP / RTS.
        prg[0..9].copy_from_slice(&[0xA2, 0x04, 0xE0, 0x03, 0xD0, 0x02, 0xEA, 0x60, 0x60]);
        let graph = cfg::discover(0, &prg, &[0x8000]).unwrap();
        let asm = emit_cfg_with_interrupts(
            &graph,
            EmitOptions { reset: 0x8000, max_blocks: Some(8), debug_trace: false },
            0x8000,
            0x8000,
        );
        let compare = asm.find("; $8002: $E0 Cpx Immediate").unwrap();
        let branch = asm.find("; $8004: $D0 Bne Relative").unwrap();
        let between = &asm[compare..branch];
        assert!(between.contains("superblock compare cached X"));
        assert!(between.contains("superblock fast compare"));
    }

    #[test]
    fn arithmetic_keeps_dirty_x_resident_and_emits_adc_sbc_inline() {
        let mut prg = vec![0xEA; 0x8000];
        // LDX #4 / LDA #$7F / CLC / ADC #1 / SEC / SBC #1 / STX $00 / RTS.
        prg[0..13].copy_from_slice(&[
            0xA2, 0x04, 0xA9, 0x7F, 0x18, 0x69, 0x01, 0x38, 0xE9, 0x01, 0x86, 0x00, 0x60,
        ]);
        let graph = cfg::discover(0, &prg, &[0x8000]).unwrap();
        let asm = emit_cfg_with_interrupts(
            &graph,
            EmitOptions { reset: 0x8000, max_blocks: Some(8), debug_trace: false },
            0x8000,
            0x8000,
        );
        let adc = asm.find("; $8005: $69 Adc Immediate").unwrap();
        let store = asm.find("; $800A: $86 Stx ZeroPage").unwrap();
        let between = &asm[adc..store];
        assert!(between.contains("superblock fast ADC"));
        assert!(between.contains("superblock fast SBC"));
        assert!(!between.contains("superblock materialize X"));
        assert!(asm[store..].contains("superblock cached X"));
    }
}'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          cargo fmt --all
          cargo test --all-targets
          cargo check --all-targets
          python3 tools/make_smoke_rom.py /tmp/nes2gbc-smoke.nes
          make generate ROM=/tmp/nes2gbc-smoke.nes MAX_BLOCKS=16
          docker run --rm -v "$PWD/runtime:/work" -w /work ghcr.io/gbdev/rgbds:latest make
          test -s runtime/build/runtime.gbc
          git config user.name nes2gbc-bot
          git config user.email actions@users.noreply.github.com
          git add src/state_superblock.rs
          git commit -m 'Keep XY resident across ADC and SBC'
          git push origin HEAD:perf/branch-fusion
