name: Apply FIT SMB direct stitch path
on:
  push:
    branches: [automation/apply-fit-wide-ring21]
    paths: ['.github/workflows/apply-fit-wide-sync-column.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/fit-screen-wide-160
          fetch-depth: 0
      - name: Remove stale dirty rebuild from SMB FIT split
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vp=Path('runtime/video.asm')
          s=vp.read_text()

          old='''    ; If a previous entering-column update is still unfinished, fall back to a\n    ; coherent 21-column rebuild at the new origin rather than exposing a slot\n    ; whose ownership is ambiguous. SMB parser floods no longer create this\n    ; state in steady scrolling, so this is now an exceptional catch-up path.\n    ld a, [nes_fit_dirty]\n    and a\n    jp nz, .full_dirty_rebase\n'''
          new='''    ; An SMB split is a continuously stitched horizontal presentation, not a\n    ; resident page that may be asynchronously rebuilt. Any stale dirty state\n    ; left by pre-split/page construction must not preempt the one-column\n    ; stitch path. Ordinary +/-1 motion below refreshes its entering column\n    ; synchronously; genuine large jumps still take .full_dirty_rebase.\n    xor a\n    ld [nes_fit_dirty], a\n'''
          if old not in s:
              raise SystemExit('scroll dirty gate not found')
          s=s.replace(old,new,1)

          old='''.fit_tile:\n    ld a, [nes_fit_dirty]\n    and a\n    ret nz\n    ; SMB's split transaction is allowed to keep publishing visible cells after\n    ; VBlank. The wide tile uploader below falls back to mode-safe byte writes,\n    ; so do not turn a long staged transaction into dirty=1 merely because the\n    ; generic VBlank fast-path latch has expired.\n    ld a, [nes_mirroring]\n    cp $01\n    jr nz, .fit_tile_unlocked\n    ldh a, [nes_split_active]\n    and a\n    jp nz, nes_video_fit_publish_source_tile_hl\n.fit_tile_unlocked:\n'''
          new='''.fit_tile:\n    ; In the proven SMB split shape, authoritative NES nametable writes are the\n    ; live source of truth. Route them straight through the scaled visibility\n    ; filter even if some older path left dirty=1 set; otherwise one stale dirty\n    ; bit suppresses every useful SMB parser write and the screen can only crawl\n    ; forward via the broken whole-page rebuild.\n    ld a, [nes_mirroring]\n    cp $01\n    jr nz, .fit_tile_dirty_gate\n    ldh a, [nes_split_active]\n    and a\n    jp nz, nes_video_fit_publish_source_tile_hl\n.fit_tile_dirty_gate:\n    ld a, [nes_fit_dirty]\n    and a\n    ret nz\n.fit_tile_unlocked:\n'''
          if old not in s:
              raise SystemExit('fit tile dirty gate not found')
          s=s.replace(old,new,1)
          vp.write_text(s)

          mp=Path('runtime/main.asm')
          m=mp.read_text()
          old='''    call nes_video_fit_update_scroll_window\n    ld a, [nes_fit_dirty]\n    and a\n    jp z, .scroll_done\n    ld a, $01\n    ld [nes_vram_unlocked], a\n    call nes_video_fit_flush_dirty\n    xor a\n    ld [nes_vram_unlocked], a\n    jp .scroll_done\n.scroll_fit_single:\n'''
          new='''    call nes_video_fit_update_scroll_window\n\n    ; SMB split mode must never fall back to the chunked resident-page rebuild.\n    ; The queue publisher above updates visible scaled tiles directly, and\n    ; update_scroll_window synchronously publishes the one entering column. A\n    ; leftover dirty flag is stale bookkeeping from construction/transition and\n    ; was the reason the same 21-column chunk kept repeating while a rebuild\n    ; crawled behind Mario.\n    xor a\n    ld [nes_fit_dirty], a\n    ld [nes_fit_recompose_my], a\n    ld [nes_fit_mt_mx], a\n    jp .scroll_done\n.scroll_fit_single:\n'''
          if old not in m:
              raise SystemExit('main split dirty flush block not found')
          m=m.replace(old,new,1)
          mp.write_text(m)
          PY
      - name: Build RGBDS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config bison libpng-dev
          git clone -q --depth 1 https://github.com/gbdev/rgbds.git /tmp/rgbds
          make -s -C /tmp/rgbds -j2
          sudo make -s -C /tmp/rgbds install
      - name: Test and smoke-build FIT_SCREEN
        run: |
          cargo test --quiet
          cargo build --quiet --release
          python3 - <<'PY'
          from pathlib import Path
          prg=bytearray([0xEA])*32768
          prg[0:3]=bytes([0x4C,0x00,0x80])
          for off,val in ((0x7FFA,0x00),(0x7FFB,0x80),(0x7FFC,0x00),(0x7FFD,0x80),(0x7FFE,0x00),(0x7FFF,0x80)):
              prg[off]=val
          Path('/tmp/fit.nes').write_bytes(bytearray(b'NES\x1a')+bytes([2,1,1,0])+bytes(8)+prg+bytes(8192))
          PY
          make gbc ROM=/tmp/fit.nes FIT_SCREEN=1 BANK_LOCALITY=0
      - name: Commit to development branch
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add runtime/video.asm runtime/main.asm
          git commit -m 'FIT_SCREEN: force SMB split onto direct stitch path'
          git push origin HEAD:dev/fit-screen-wide-160
