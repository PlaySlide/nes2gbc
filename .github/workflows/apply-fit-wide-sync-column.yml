name: Apply FIT SMB armed-scroll fix
on:
  push:
    branches: [automation/apply-fit-wide-ring21]
    paths: ['.github/workflows/apply-fit-wide-sync-column.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/fit-screen-wide-160
          fetch-depth: 0
      - name: Make FIT SMB scroll consume the same armed frame state as the working stitch path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('runtime/video.asm')
          s=p.read_text()
          old='''.slide_vert:\n    ; Effective NES X in BC (0..511), including logical nametable bit 0.\n    ldh a, [nes_split_bottom_x]\n    ld c, a\n    ldh a, [nes_view_x]\n    add c\n    ld c, a\n    ld b, $00\n    jr nc, .eff_nt\n    inc b\n.eff_nt:\n    ldh a, [nes_split_bottom_ctrl]\n    and $01\n    xor b\n    ld b, a\n'''
          new='''.slide_vert:\n    ; Effective NES X in BC (0..511), including logical nametable bit 0.\n    ; IMPORTANT: use the same ARMED split/camera snapshot that the current\n    ; host frame is actually presenting. The non-scaled SMB stitch path does\n    ; this already. Using live split/view state here let OAM follow-camera work\n    ; advance the FIT ring one host frame ahead of the raster state, producing\n    ; the once-per-coarse-tile whole-scene snap.\n    ldh a, [nes_split_armed_x]\n    ld c, a\n    ld a, [nes_view_armed_x]\n    add c\n    ld c, a\n    ld b, $00\n    jr nc, .eff_nt\n    inc b\n.eff_nt:\n    ldh a, [nes_split_armed_ctrl]\n    and $01\n    xor b\n    ld b, a\n'''
          if old not in s:
              raise SystemExit('armed-scroll target block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Build RGBDS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config bison libpng-dev
          git clone -q --depth 1 https://github.com/gbdev/rgbds.git /tmp/rgbds
          make -s -C /tmp/rgbds -j2
          sudo make -s -C /tmp/rgbds install
      - name: Test and smoke-build FIT_SCREEN
        run: |
          cargo test --quiet
          cargo build --quiet --release
          python3 - <<'PY'
          from pathlib import Path
          prg=bytearray([0xEA])*32768
          prg[0:3]=bytes([0x4C,0x00,0x80])
          for off,val in ((0x7FFA,0x00),(0x7FFB,0x80),(0x7FFC,0x00),(0x7FFD,0x80),(0x7FFE,0x00),(0x7FFF,0x80)):
              prg[off]=val
          Path('/tmp/fit.nes').write_bytes(bytearray(b'NES\x1a')+bytes([2,1,1,0])+bytes(8)+prg+bytes(8192))
          PY
          make gbc ROM=/tmp/fit.nes FIT_SCREEN=1 BANK_LOCALITY=0
      - name: Commit to development branch
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add runtime/video.asm
          git commit -m 'FIT_SCREEN: use armed SMB raster state for scrolling'
          git push origin HEAD:dev/fit-screen-wide-160
