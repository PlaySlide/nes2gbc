name: Apply FIT 32-column stitch math
on:
  push:
    branches: [automation/apply-fit-wide-ring21]
    paths: ['.github/workflows/apply-fit-wide-sync-column.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/fit-screen-wide-160
          fetch-depth: 0
      - name: Mirror working SMB 32-column stitch geometry in FIT
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vp = Path('runtime/video.asm')
          s = vp.read_text()

          old = '''.forward_distance_ready:\n    and a\n    jp z, .scx_from_ring\n    cp 9\n    jr c, .catchup_forward\n\n    ld a, b\n    sub c\n    jr nc, .backward_distance_ready\n    add 40\n.backward_distance_ready:\n    cp 9\n    jr c, .catchup_backward\n'''
          new = '''.forward_distance_ready:\n    and a\n    jp z, .scx_from_ring\n    cp 1\n    jr z, .delta_plus1\n    cp 9\n    jp c, .catchup_forward\n\n    ld a, b\n    sub c\n    jr nc, .backward_distance_ready\n    add 40\n.backward_distance_ready:\n    cp 1\n    jr z, .delta_minus1\n    cp 9\n    jp c, .catchup_backward\n'''
          if old not in s:
              raise SystemExit('distance gate not found')
          s = s.replace(old, new, 1)

          marker = '''    ld a, [nes_fit_mt_quad + 3]\n    ld c, a\n    ld [nes_fit_origin_mx], a\n    jp .full_dirty_rebase\n\n.catchup_forward:\n'''
          repl = '''    ld a, [nes_fit_mt_quad + 3]\n    ld c, a\n    ld [nes_fit_origin_mx], a\n    jp .full_dirty_rebase\n\n.delta_plus1:\n    ; Same geometry as the working non-scaled stitch: after advancing one\n    ; coarse column, recycle the OLD leftmost physical column as the NEW\n    ; far-right backing column (offset 31), never the visible edge (offset 20).\n    ld a, [nes_fit_origin_mx]\n    inc a\n    cp 40\n    jr c, .plus_origin_ok\n    xor a\n.plus_origin_ok:\n    ld [nes_fit_origin_mx], a\n    ld a, [nes_fit_vram_page]\n    ld d, a\n    and $F8\n    add $08\n    and $F8\n    ld b, a\n    ld a, d\n    and $04\n    or b\n    ld [nes_fit_vram_page], a\n    ld a, $02\n    ld [nes_fit_dirty], a\n    xor a\n    ld [nes_fit_recompose_my], a\n    ld a, 31\n    ld [nes_fit_mt_mx], a\n    jp .scx_from_ring\n\n.delta_minus1:\n    ld a, [nes_fit_origin_mx]\n    and a\n    jr nz, .minus_dec\n    ld a, 40\n.minus_dec:\n    dec a\n    ld [nes_fit_origin_mx], a\n    ld a, [nes_fit_vram_page]\n    ld d, a\n    and $F8\n    sub $08\n    and $F8\n    ld b, a\n    ld a, d\n    and $04\n    or b\n    ld [nes_fit_vram_page], a\n    ld a, $03\n    ld [nes_fit_dirty], a\n    xor a\n    ld [nes_fit_recompose_my], a\n    ld [nes_fit_mt_mx], a\n    jp .scx_from_ring\n\n.catchup_forward:\n'''
          if marker not in s:
              raise SystemExit('delta insertion marker not found')
          s = s.replace(marker, repl, 1)

          old = '''    ld a, 20\n    ld [nes_fit_mt_mx], a\n    xor a\n    ld [nes_fit_mt_my], a\n.sync_right_row:\n'''
          new = '''    ld a, 31\n    ld [nes_fit_mt_mx], a\n    xor a\n    ld [nes_fit_mt_my], a\n.sync_right_row:\n'''
          if old not in s:
              raise SystemExit('sync right column not found')
          s = s.replace(old, new, 1)

          old = '''.col_right:\n    ld a, 20\n    jr .col_set\n'''
          new = '''.col_right:\n    ld a, 31\n    jr .col_set\n'''
          if old not in s:
              raise SystemExit('dirty right column not found')
          s = s.replace(old, new, 1)

          old = '''    ld a, [nes_fit_mt_mx]\n    inc a\n    ld [nes_fit_mt_mx], a\n    cp 21\n    jr c, .xloop\n'''
          new = '''    ld a, [nes_fit_mt_mx]\n    inc a\n    ld [nes_fit_mt_mx], a\n    cp 32\n    jr c, .xloop\n'''
          if old not in s:
              raise SystemExit('full rebuild width not found')
          s = s.replace(old, new, 1)

          old = '''.second_delta_ready:\n    cp 21\n    jr nc, .second_done\n    ld [nes_fit_mt_quad + 3], a\n.second_done:\n\n    ; First destination if visible in [origin, origin+21).\n'''
          new = '''.second_delta_ready:\n    cp 32\n    jr nc, .second_done\n    ld [nes_fit_mt_quad + 3], a\n.second_done:\n\n    ; Keep the complete 32-column stitched backing surface current. The actual\n    ; viewport scans only offsets 0..20; offsets 21..31 are future columns.\n'''
          if old not in s:
              raise SystemExit('second publisher width not found')
          s = s.replace(old, new, 1)

          old = '''.first_delta_ready:\n    cp 21\n    jr nc, .after_first\n    ld [nes_fit_mt_mx], a\n'''
          new = '''.first_delta_ready:\n    cp 32\n    jr nc, .after_first\n    ld [nes_fit_mt_mx], a\n'''
          if old not in s:
              raise SystemExit('first publisher width not found')
          s = s.replace(old, new, 1)

          s = s.replace(
              '; 21-column circular live window over the 40 GBC tile columns that represent\n; the two-nametable horizontal NES world at 5/8 scale. A 160px viewport needs\n; 20 full tiles plus one partial entering tile whenever SCX has a fine offset.\n',
              '; 32-column stitched backing ring over the 40 scaled world columns. The\n; 160px viewport scans 20 full tiles plus one partial edge (21 columns), while\n; the remaining 11 physical columns are the same future buffer used by main.\n', 1)
          s = s.replace(
              '; Full rebuild covers the 21 potentially scanned columns. Entering columns\n; get four tiles per call so ordinary horizontal scroll can catch up.\n',
              '; Full rebuild covers all 32 stitched backing columns. Only 21 are scanned;\n; the remaining 11 must stay valid so they can rotate into view without holes.\n', 1)
          vp.write_text(s)

          mp = Path('runtime/main.asm')
          m = mp.read_text()
          old = '''    ; SMB split mode must never fall back to the chunked resident-page rebuild.\n    ; The queue publisher above updates visible scaled tiles directly, and\n    ; update_scroll_window synchronously publishes the one entering column. A\n    ; leftover dirty flag is stale bookkeeping from construction/transition and\n    ; was the reason the same 21-column chunk kept repeating while a rebuild\n    ; crawled behind Mario.\n    xor a\n    ld [nes_fit_dirty], a\n    ld [nes_fit_recompose_my], a\n    ld [nes_fit_mt_mx], a\n    jp .scroll_done\n'''
          new = '''    ; Preserve recycled-column progress. It is now offset 31/0, eleven whole\n    ; columns offscreen, so it can finish incrementally without blocking scanout.\n    jp .scroll_done\n'''
          if old not in m:
              raise SystemExit('SMB FIT dirty cleanup block not found')
          m = m.replace(old, new, 1)
          m = m.replace(
              '; Wide FIT smooth scrolling owns a 21st entering-edge column. Give only\n    ; that incremental column update (dirty=2/3) first use of VBlank before\n',
              '; Wide FIT mirrors the proven 32-column stitch. Give the recycled\n    ; far-offscreen column update (dirty=2/3) first use of VBlank before\n', 1)
          mp.write_text(m)
          PY
      - name: Build RGBDS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config bison libpng-dev
          git clone -q --depth 1 https://github.com/gbdev/rgbds.git /tmp/rgbds
          make -s -C /tmp/rgbds -j2
          sudo make -s -C /tmp/rgbds install
      - name: Test and smoke-build FIT_SCREEN
        run: |
          cargo test --quiet
          cargo build --quiet --release
          python3 - <<'PY'
          from pathlib import Path
          prg=bytearray([0xEA])*32768
          prg[0:3]=bytes([0x4C,0x00,0x80])
          for off,val in ((0x7FFA,0x00),(0x7FFB,0x80),(0x7FFC,0x00),(0x7FFD,0x80),(0x7FFE,0x00),(0x7FFF,0x80)):
              prg[off]=val
          Path('/tmp/fit.nes').write_bytes(bytearray(b'NES\x1a')+bytes([2,1,1,0])+bytes(8)+prg+bytes(8192))
          PY
          make gbc ROM=/tmp/fit.nes FIT_SCREEN=1 BANK_LOCALITY=0
      - name: Commit to development branch
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add runtime/video.asm runtime/main.asm
          git commit -m 'FIT_SCREEN: mirror proven 32-column SMB stitch math'
          git push origin HEAD:dev/fit-screen-wide-160
