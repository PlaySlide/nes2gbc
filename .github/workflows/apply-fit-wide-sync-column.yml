name: Apply FIT SMB live guard refresh
on:
  push:
    branches: [automation/apply-fit-wide-ring21]
    paths: ['.github/workflows/apply-fit-wide-sync-column.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/fit-screen-wide-160
          fetch-depth: 0
      - name: Let SMB parser writes refresh the offscreen guard column
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('runtime/video.asm')
          s=p.read_text()

          old='''.second_delta_ready:\n    cp 21\n    jr nc, .second_done\n    ld [nes_fit_mt_quad + 3], a\n.second_done:\n\n    ; First destination if visible in [origin, origin+21).\n    ld a, [nes_fit_origin_mx]\n'''
          new='''.second_delta_ready:\n    ; Offsets 0..20 are scanned; offset 21 is the fully-offscreen guard.\n    ; Keep the guard live too: SMB often writes a future parser column AFTER\n    ; its once-per-frame precompose pass has already visited that row. If those\n    ; writes are filtered out here, the stale/blank guard rotates on-screen at\n    ; the next coarse step and produces the repeating holes/old scenery.\n    cp 22\n    jr nc, .second_done\n    ld [nes_fit_mt_quad + 3], a\n.second_done:\n\n    ; First destination if visible or in the one-column guard [origin,origin+22).\n    ld a, [nes_fit_origin_mx]\n'''
          if old not in s:
              raise SystemExit('second-destination FIT visibility gate not found')
          s=s.replace(old,new,1)

          old='''.first_delta_ready:\n    cp 21\n    jr nc, .after_first\n    ld [nes_fit_mt_mx], a\n'''
          new='''.first_delta_ready:\n    cp 22\n    jr nc, .after_first\n    ld [nes_fit_mt_mx], a\n'''
          if old not in s:
              raise SystemExit('first-destination FIT visibility gate not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Build RGBDS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config bison libpng-dev
          git clone -q --depth 1 https://github.com/gbdev/rgbds.git /tmp/rgbds
          make -s -C /tmp/rgbds -j2
          sudo make -s -C /tmp/rgbds install
      - name: Test and smoke-build FIT_SCREEN
        run: |
          cargo test --quiet
          cargo build --quiet --release
          python3 - <<'PY'
          from pathlib import Path
          prg=bytearray([0xEA])*32768
          prg[0:3]=bytes([0x4C,0x00,0x80])
          for off,val in ((0x7FFA,0x00),(0x7FFB,0x80),(0x7FFC,0x00),(0x7FFD,0x80),(0x7FFE,0x00),(0x7FFF,0x80)):
              prg[off]=val
          Path('/tmp/fit.nes').write_bytes(bytearray(b'NES\x1a')+bytes([2,1,1,0])+bytes(8)+prg+bytes(8192))
          PY
          make gbc ROM=/tmp/fit.nes FIT_SCREEN=1 BANK_LOCALITY=0
      - name: Commit to development branch
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add runtime/video.asm
          git commit -m 'FIT_SCREEN: keep SMB guard current from parser writes'
          git push origin HEAD:dev/fit-screen-wide-160
