name: Apply FIT SMB split-safe column compose
on:
  push:
    branches: [automation/apply-fit-wide-ring21]
    paths: ['.github/workflows/apply-fit-wide-sync-column.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/fit-screen-wide-160
          fetch-depth: 0
      - name: Let STAT split preempt synchronous FIT column compose
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('runtime/video.asm')
          s=p.read_text()

          old='''    ld [nes_fit_vram_page], a\n\n    push de                    ; preserve fine host X in E\n    ld a, 20                   ; new right-edge / partial column\n    ld [nes_fit_mt_mx], a\n    xor a\n    ld [nes_fit_mt_my], a\n.fit_sync_right_row:\n    call nes_video_fit_publish_at_mx_my\n    ld a, [nes_fit_mt_my]\n    inc a\n    ld [nes_fit_mt_my], a\n    cp 15\n    jr c, .fit_sync_right_row\n    xor a\n    ld [nes_fit_dirty], a\n    ld a, 15\n    ld [nes_fit_recompose_my], a\n    pop de\n    jp .scx_from_ring\n'''
          new='''    ld [nes_fit_vram_page], a\n\n    ; The 15-tile wide-column compose can outlive VBlank. Publish the NEW\n    ; playfield SCX before doing that work, then temporarily allow only STAT\n    ; to nest so the line-32 HUD/playfield split still fires on time. Without\n    ; this, every coarse tile boundary misses LYC and the entire lower scene is\n    ; drawn for one frame with the HUD/top SCX -- the observed half-screen snap.\n    ld a, [nes_fit_vram_page]\n    and $F8\n    add e\n    ld [nes_fit_play_scx], a\n\n    ldh a, [rIE]\n    push af\n    ld a, $02                  ; STAT only; never nest VBlank\n    ldh [rIE], a\n    ei\n    nop\n\n    push de                    ; preserve fine host X in E\n    ld a, 20                   ; new right-edge / partial column\n    ld [nes_fit_mt_mx], a\n    xor a\n    ld [nes_fit_mt_my], a\n.fit_sync_right_row:\n    call nes_video_fit_publish_at_mx_my\n    ld a, [nes_fit_mt_my]\n    inc a\n    ld [nes_fit_mt_my], a\n    cp 15\n    jr c, .fit_sync_right_row\n    xor a\n    ld [nes_fit_dirty], a\n    ld a, 15\n    ld [nes_fit_recompose_my], a\n    pop de\n\n    di\n    pop af\n    ldh [rIE], a\n    jp .scx_from_ring\n'''
          if old not in s:
              raise SystemExit('right synchronous column block not found')
          s=s.replace(old,new,1)

          old='''    ld [nes_fit_vram_page], a\n\n    push de\n    xor a\n    ld [nes_fit_mt_mx], a\n    ld [nes_fit_mt_my], a\n.fit_sync_left_row:\n    call nes_video_fit_publish_at_mx_my\n    ld a, [nes_fit_mt_my]\n    inc a\n    ld [nes_fit_mt_my], a\n    cp 15\n    jr c, .fit_sync_left_row\n    xor a\n    ld [nes_fit_dirty], a\n    ld a, 15\n    ld [nes_fit_recompose_my], a\n    pop de\n    jp .scx_from_ring\n'''
          new='''    ld [nes_fit_vram_page], a\n\n    ; Same split-deadline protection for reverse motion.\n    ld a, [nes_fit_vram_page]\n    and $F8\n    add e\n    ld [nes_fit_play_scx], a\n\n    ldh a, [rIE]\n    push af\n    ld a, $02\n    ldh [rIE], a\n    ei\n    nop\n\n    push de\n    xor a\n    ld [nes_fit_mt_mx], a\n    ld [nes_fit_mt_my], a\n.fit_sync_left_row:\n    call nes_video_fit_publish_at_mx_my\n    ld a, [nes_fit_mt_my]\n    inc a\n    ld [nes_fit_mt_my], a\n    cp 15\n    jr c, .fit_sync_left_row\n    xor a\n    ld [nes_fit_dirty], a\n    ld a, 15\n    ld [nes_fit_recompose_my], a\n    pop de\n\n    di\n    pop af\n    ldh [rIE], a\n    jp .scx_from_ring\n'''
          if old not in s:
              raise SystemExit('left synchronous column block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Build RGBDS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config bison libpng-dev
          git clone -q --depth 1 https://github.com/gbdev/rgbds.git /tmp/rgbds
          make -s -C /tmp/rgbds -j2
          sudo make -s -C /tmp/rgbds install
      - name: Test and smoke-build FIT_SCREEN
        run: |
          cargo test --quiet
          cargo build --quiet --release
          python3 - <<'PY'
          from pathlib import Path
          prg=bytearray([0xEA])*32768
          prg[0:3]=bytes([0x4C,0x00,0x80])
          for off,val in ((0x7FFA,0x00),(0x7FFB,0x80),(0x7FFC,0x00),(0x7FFD,0x80),(0x7FFE,0x00),(0x7FFF,0x80)):
              prg[off]=val
          Path('/tmp/fit.nes').write_bytes(bytearray(b'NES\x1a')+bytes([2,1,1,0])+bytes(8)+prg+bytes(8192))
          PY
          make gbc ROM=/tmp/fit.nes FIT_SCREEN=1 BANK_LOCALITY=0
      - name: Commit to development branch
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add runtime/video.asm
          git commit -m 'FIT_SCREEN: preserve SMB raster split during column compose'
          git push origin HEAD:dev/fit-screen-wide-160
