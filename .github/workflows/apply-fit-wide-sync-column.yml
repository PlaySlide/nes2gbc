name: Apply FIT SMB host-vblank guard prefetch
on:
  push:
    branches: [automation/apply-fit-wide-ring21]
    paths: ['.github/workflows/apply-fit-wide-sync-column.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/fit-screen-wide-160
          fetch-depth: 0
      - name: Run guard prefetch on every host VBlank
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('runtime/main.asm')
          s=p.read_text()

          old='''.early_split_done:\n\n    ; A translated NES NMI may take more than one host GBC frame. Never publish\n    ; partially updated NES video state while it is still running; staged OAM,\n'''
          new='''.early_split_done:\n\n    ; The wide FIT guard must advance on EVERY host VBlank, not only on host\n    ; frames where the translated NES NMI has completed. SMB's translated NMI\n    ; often spans several GBC frames; placing this work under .commit_ready left\n    ; fewer than 15 compose opportunities between coarse 8px boundaries, so the\n    ; boundary path fell back to the old 15-tile synchronous compose and stalled\n    ; VBlank for >1 frame. The guard is offset 21 and therefore fully offscreen.\n    ld a, [nes_fit_screen]\n    and a\n    jr z, .fit_guard_host_done\n    ld a, [nes_mirroring]\n    cp $01\n    jr nz, .fit_guard_host_done\n    ldh a, [nes_split_active]\n    and a\n    jr z, .fit_guard_host_done\n    call nes_video_fit_prefetch_right_guard_row\n.fit_guard_host_done:\n\n    ; A translated NES NMI may take more than one host GBC frame. Never publish\n    ; partially updated NES video state while it is still running; staged OAM,\n'''
          if old not in s:
              raise SystemExit('early_split_done insertion point not found')
          s=s.replace(old,new,1)

          old='''    call nes_video_fit_update_scroll_window\n    ; Do one fifteenth of the NEXT entering column now, while it is still\n    ; completely offscreen. This replaces the old 15-tile synchronous burst\n    ; that the mGBA video log shows spanning more than one whole host frame.\n    call nes_video_fit_prefetch_right_guard_row\n.fit_edge_done:\n'''
          new='''    call nes_video_fit_update_scroll_window\n    ; Guard-row precompose now runs above the nes_nmi_active gate so it truly\n    ; gets one opportunity per host VBlank. Do not double-advance it here on\n    ; completed-NMI frames.\n.fit_edge_done:\n'''
          if old not in s:
              raise SystemExit('commit_ready guard call not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Build RGBDS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config bison libpng-dev
          git clone -q --depth 1 https://github.com/gbdev/rgbds.git /tmp/rgbds
          make -s -C /tmp/rgbds -j2
          sudo make -s -C /tmp/rgbds install
      - name: Test and smoke-build FIT_SCREEN
        run: |
          cargo test --quiet
          cargo build --quiet --release
          python3 - <<'PY'
          from pathlib import Path
          prg=bytearray([0xEA])*32768
          prg[0:3]=bytes([0x4C,0x00,0x80])
          for off,val in ((0x7FFA,0x00),(0x7FFB,0x80),(0x7FFC,0x00),(0x7FFD,0x80),(0x7FFE,0x00),(0x7FFF,0x80)):
              prg[off]=val
          Path('/tmp/fit.nes').write_bytes(bytearray(b'NES\x1a')+bytes([2,1,1,0])+bytes(8)+prg+bytes(8192))
          PY
          make gbc ROM=/tmp/fit.nes FIT_SCREEN=1 BANK_LOCALITY=0
      - name: Commit to development branch
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add runtime/main.asm
          git commit -m 'FIT_SCREEN: precompose SMB guard every host VBlank'
          git push origin HEAD:dev/fit-screen-wide-160
