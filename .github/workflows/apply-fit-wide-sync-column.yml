name: Apply FIT SMB split page fix
on:
  push:
    branches: [automation/apply-fit-wide-ring21]
    paths: ['.github/workflows/apply-fit-wide-sync-column.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/fit-screen-wide-160
          fetch-depth: 0
      - name: Keep SMB split world out of resident-page dirty path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('runtime/video.asm')
          s=p.read_text()
          old='''    call nes_video_fit_displayed_page\n    ld b, a\n    ld a, [nes_fit_vram_page]\n    and $04\n    cp b\n    jr z, .page_done\n    ld a, [nes_fit_vram_page]\n    and $F8\n    or b\n    ld [nes_fit_vram_page], a\n    ld a, $01\n    ld [nes_fit_dirty], a\n    xor a\n    ld [nes_fit_recompose_my], a\n    ld [nes_fit_mt_mx], a\n.page_done:\n'''
          new='''    ; Vertical-mirroring split games (SMB) use both physical NES nametables\n    ; as one horizontal world. PPUCTRL.0 is already folded into the effective\n    ; world X below; treating it as a resident-page change here incorrectly\n    ; forces dirty=1 and bypasses the stitch-style entering-column path.\n    ld a, [nes_mirroring]\n    cp $01\n    jr nz, .fit_page_check\n    ldh a, [nes_split_active]\n    and a\n    jr nz, .page_done\n.fit_page_check:\n    call nes_video_fit_displayed_page\n    ld b, a\n    ld a, [nes_fit_vram_page]\n    and $04\n    cp b\n    jr z, .page_done\n    ld a, [nes_fit_vram_page]\n    and $F8\n    or b\n    ld [nes_fit_vram_page], a\n    ld a, $01\n    ld [nes_fit_dirty], a\n    xor a\n    ld [nes_fit_recompose_my], a\n    ld [nes_fit_mt_mx], a\n.page_done:\n'''
          if old not in s:
              raise SystemExit('target page block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Build RGBDS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config bison libpng-dev
          git clone -q --depth 1 https://github.com/gbdev/rgbds.git /tmp/rgbds
          make -s -C /tmp/rgbds -j2
          sudo make -s -C /tmp/rgbds install
      - name: Test and smoke-build FIT_SCREEN
        run: |
          cargo test --quiet
          cargo build --quiet --release
          python3 - <<'PY'
          from pathlib import Path
          prg=bytearray([0xEA])*32768
          prg[0:3]=bytes([0x4C,0x00,0x80])
          for off,val in ((0x7FFA,0x00),(0x7FFB,0x80),(0x7FFC,0x00),(0x7FFD,0x80),(0x7FFE,0x00),(0x7FFF,0x80)):
              prg[off]=val
          Path('/tmp/fit.nes').write_bytes(bytearray(b'NES\x1a')+bytes([2,1,1,0])+bytes(8)+prg+bytes(8192))
          PY
          make gbc ROM=/tmp/fit.nes FIT_SCREEN=1 BANK_LOCALITY=0
      - name: Commit to development branch
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add runtime/video.asm
          git commit -m 'FIT_SCREEN: keep SMB split out of resident-page dirty path'
          git push origin HEAD:dev/fit-screen-wide-160
