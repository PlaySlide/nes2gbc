name: Apply FIT SMB guard precompose
on:
  push:
    branches: [automation/apply-fit-wide-ring21]
    paths: ['.github/workflows/apply-fit-wide-sync-column.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/fit-screen-wide-160
          fetch-depth: 0
      - name: Precompose the next SMB FIT column across host frames
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vp=Path('runtime/video.asm')
          s=vp.read_text()

          old='''    and a\n    jp z, .scx_from_ring\n    cp 9\n    jr c, .catchup_forward\n'''
          new='''    and a\n    jp z, .scx_from_ring\n    cp 1\n    jr z, .consume_prefetched_forward\n    cp 9\n    jr c, .catchup_forward\n'''
          if old not in s:
              raise SystemExit('forward-distance gate not found')
          s=s.replace(old,new,1)

          marker='''    ; Genuine discontinuity/area transition. Keep the existing transition path.\n    ld a, [nes_fit_mt_quad + 3]\n    ld c, a\n    ld [nes_fit_origin_mx], a\n    jp .full_dirty_rebase\n\n.catchup_forward:\n'''
          repl='''    ; Genuine discontinuity/area transition. Keep the existing transition path.\n    ld a, [nes_fit_mt_quad + 3]\n    ld c, a\n    ld [nes_fit_origin_mx], a\n    jp .full_dirty_rebase\n\n.consume_prefetched_forward:\n    ; The next entering column is composed one row per host frame at viewport\n    ; offset 21, which is fully offscreen. A normal +1 coarse step therefore\n    ; only rotates that completed guard column into offset 20; it must NOT spend\n    ; an entire host frame synchronously composing 15 tiles at the boundary.\n    ld a, [nes_fit_recompose_my]\n    cp 15\n    jr nc, .prefetch_ready\n\n    ; Startup/transition safety: if the guard has not had 15 host frames yet,\n    ; fall back to the older synchronous path for this one step. Steady SMB\n    ; scrolling has ~30+ host frames between coarse FIT boundaries, so this\n    ; should not be the normal path.\n    ld a, 1\n    jp .catchup_forward\n\n.prefetch_ready:\n    ld a, [nes_fit_vram_page]\n    ld d, a\n    and $F8\n    add $08\n    and $F8\n    ld b, a\n    ld a, d\n    and $04\n    or b\n    ld [nes_fit_vram_page], a\n\n    ld a, [nes_fit_mt_quad + 3]\n    ld [nes_fit_origin_mx], a\n\n    xor a\n    ld [nes_fit_dirty], a\n    ld [nes_fit_recompose_my], a ; begin composing the following guard column\n    jp .scx_from_ring\n\n.catchup_forward:\n'''
          if marker not in s:
              raise SystemExit('catchup insertion marker not found')
          s=s.replace(marker,repl,1)

          marker='''.split_regs_done:\n    ret\n\nnes_video_fit_displayed_page:\n'''
          repl='''.split_regs_done:\n    ret\n\n; Compose exactly one row of the NEXT right-edge column while it is still one\n; full GBC tile offscreen. At 160px the scanned window is offsets 0..20, so\n; offset 21 is a safe guard slot. SMB advances roughly one FIT coarse column\n; every few dozen host frames, giving this 15-row job ample time without ever\n; blocking a complete frame at the scroll boundary. recompose_my is persistent\n; progress 0..15 for this guard and is reset only when the guard is consumed.\nnes_video_fit_prefetch_right_guard_row:\n    ld a, [nes_fit_recompose_my]\n    cp 15\n    ret nc\n    ld [nes_fit_mt_my], a\n    ld a, 21\n    ld [nes_fit_mt_mx], a\n    call nes_video_fit_publish_at_mx_my\n    ld a, [nes_fit_recompose_my]\n    inc a\n    ld [nes_fit_recompose_my], a\n    ret\n\nnes_video_fit_displayed_page:\n'''
          if marker not in s:
              raise SystemExit('prefetch routine insertion marker not found')
          s=s.replace(marker,repl,1)

          # After any rare synchronous multi-column catch-up, start a fresh
          # offscreen guard instead of leaving progress at 15.
          old='''    di\n    pop af\n    ldh [rIE], a\n    jp .scx_from_ring\n\n.catchup_backward:\n'''
          new='''    di\n    pop af\n    ldh [rIE], a\n    xor a\n    ld [nes_fit_recompose_my], a\n    jp .scx_from_ring\n\n.catchup_backward:\n'''
          if old not in s:
              raise SystemExit('forward catchup epilogue not found')
          s=s.replace(old,new,1)

          vp.write_text(s)

          mp=Path('runtime/main.asm')
          m=mp.read_text()
          old='''    call nes_video_fit_update_scroll_window\n    ld a, [nes_fit_dirty]\n    cp $02\n    jr z, .fit_edge_service\n    cp $03\n    jr nz, .fit_edge_done\n.fit_edge_service:\n    ld a, $01\n    ld [nes_vram_unlocked], a\n    call nes_video_fit_flush_dirty\n    xor a\n    ld [nes_vram_unlocked], a\n.fit_edge_done:\n'''
          new='''    call nes_video_fit_update_scroll_window\n    ; Do one fifteenth of the NEXT entering column now, while it is still\n    ; completely offscreen. This replaces the old 15-tile synchronous burst\n    ; that the mGBA video log shows spanning more than one whole host frame.\n    call nes_video_fit_prefetch_right_guard_row\n.fit_edge_done:\n'''
          if old not in m:
              raise SystemExit('early FIT edge-service block not found')
          m=m.replace(old,new,1)

          old='''    xor a\n    ld [nes_fit_dirty], a\n    ld [nes_fit_recompose_my], a\n    ld [nes_fit_mt_mx], a\n    jp .scroll_done\n'''
          new='''    xor a\n    ld [nes_fit_dirty], a\n    ; Keep recompose_my: in SMB split mode it is the persistent 0..15 progress\n    ; of the fully-offscreen right guard column built by the early VBlank step.\n    ld [nes_fit_mt_mx], a\n    jp .scroll_done\n'''
          if old not in m:
              raise SystemExit('SMB FIT scroll cleanup block not found')
          m=m.replace(old,new,1)
          mp.write_text(m)
          PY
      - name: Build RGBDS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config bison libpng-dev
          git clone -q --depth 1 https://github.com/gbdev/rgbds.git /tmp/rgbds
          make -s -C /tmp/rgbds -j2
          sudo make -s -C /tmp/rgbds install
      - name: Test and smoke-build FIT_SCREEN
        run: |
          cargo test --quiet
          cargo build --quiet --release
          python3 - <<'PY'
          from pathlib import Path
          prg=bytearray([0xEA])*32768
          prg[0:3]=bytes([0x4C,0x00,0x80])
          for off,val in ((0x7FFA,0x00),(0x7FFB,0x80),(0x7FFC,0x00),(0x7FFD,0x80),(0x7FFE,0x00),(0x7FFF,0x80)):
              prg[off]=val
          Path('/tmp/fit.nes').write_bytes(bytearray(b'NES\x1a')+bytes([2,1,1,0])+bytes(8)+prg+bytes(8192))
          PY
          make gbc ROM=/tmp/fit.nes FIT_SCREEN=1 BANK_LOCALITY=0
      - name: Commit to development branch
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add runtime/video.asm runtime/main.asm
          git commit -m 'FIT_SCREEN: precompose SMB entering column across frames'
          git push origin HEAD:dev/fit-screen-wide-160
