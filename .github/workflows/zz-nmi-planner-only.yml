name: Temporary planner-only NMI experiment

on:
  push:
    branches:
      - perf/branch-fusion
    paths:
      - .github/workflows/zz-nmi-planner-only.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/branch-fusion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply planner-only NMI patch
        run: python3 tools/apply_nmi_relaxed_planner_only.py
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --all-targets
      - name: Check
        run: cargo check --all-targets
      - name: Generate synthetic NES ROM
        run: python3 tools/make_smoke_rom.py /tmp/nes2gbc-smoke.nes
      - name: Recompile generated ASM
        run: make generate ROM=/tmp/nes2gbc-smoke.nes MAX_BLOCKS=16
      - name: Reject duplicate generated labels
        run: |
          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          labels=[]
          for line in Path('runtime/generated.asm').read_text().splitlines():
              m=re.match(r'^\s*([A-Za-z_][A-Za-z0-9_]*):\s*$', line)
              if m:
                  labels.append(m.group(1))
          dup=[k for k,v in Counter(labels).items() if v>1]
          assert not dup, f'duplicate labels: {dup[:20]}'
          print('duplicate-label scan: ok')
          PY
      - name: Assemble generated GBC ROM with RGBDS
        run: docker run --rm -v "$PWD/runtime:/work" -w /work ghcr.io/gbdev/rgbds:latest make
      - name: Commit source patch
        run: |
          git add src/state_superblock.rs
          git commit -m "Relax only proven NMI-private trace planning"
          git push origin HEAD:perf/branch-fusion
