name: Apply FIT attribute preserve fix
on:
  push:
    branches: [automation/apply-fit-wide-ring21]
    paths: ['.github/workflows/apply-fit-attr-preserve.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/fit-screen-wide-160
          fetch-depth: 0
      - name: Preserve scaled attribute across map-address calculation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('runtime/video.asm')
          s = p.read_text()
          old = '''    ld a, [nes_fit_mt_mx]\n    add b\n    and $1F\n    call nes_video_fit_map_addr_a\n\n    call nes_video_wait_vram\n    ld a, $01\n    ldh [rVBK], a\n    ld a, c\n    ld [de], a\n'''
          new = '''    ld a, [nes_fit_mt_mx]\n    add b\n    and $1F\n    ; map_addr_a uses C for the physical map column. Preserve C here because\n    ; it is the CGB attribute byte (palette + pattern VRAM bank) we must write.\n    ; Losing it made the physical column number itself become the attribute,\n    ; randomly selecting the wrong pattern bank across vertical strips.\n    push bc\n    call nes_video_fit_map_addr_a\n    pop bc\n\n    call nes_video_wait_vram\n    ld a, $01\n    ldh [rVBK], a\n    ld a, c\n    ld [de], a\n'''
          if old not in s:
              raise SystemExit('FIT attribute map-address write site not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Build RGBDS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config bison libpng-dev
          git clone -q --depth 1 https://github.com/gbdev/rgbds.git /tmp/rgbds
          make -s -C /tmp/rgbds -j2
          sudo make -s -C /tmp/rgbds install
      - name: Test and smoke-build FIT_SCREEN
        run: |
          cargo test --quiet
          cargo build --quiet --release
          python3 - <<'PY'
          from pathlib import Path
          prg=bytearray([0xEA])*32768
          prg[0:3]=bytes([0x4C,0x00,0x80])
          for off,val in ((0x7FFA,0x00),(0x7FFB,0x80),(0x7FFC,0x00),(0x7FFD,0x80),(0x7FFE,0x00),(0x7FFF,0x80)):
              prg[off]=val
          Path('/tmp/fit.nes').write_bytes(bytearray(b'NES\x1a')+bytes([2,1,1,0])+bytes(8)+prg+bytes(8192))
          PY
          make gbc ROM=/tmp/fit.nes FIT_SCREEN=1 BANK_LOCALITY=0
      - name: Commit to development branch
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add runtime/video.asm
          git commit -m 'FIT_SCREEN: preserve scaled attribute across map lookup'
          git push origin HEAD:dev/fit-screen-wide-160
