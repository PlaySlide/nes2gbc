name: Fix trace liveness boundaries

on:
  push:
    branches:
      - perf/branch-fusion
    paths:
      - .github/workflows/zz-fix-trace-liveness-boundaries.yml

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/branch-fusion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply trace liveness boundary fix
        run: python3 tools/apply_trace_liveness_boundaries.py
      - name: Liveness boundary self-test
        run: |
          python3 - <<'PY'
          import importlib.util, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import dead_terminal_zn as d
          lines = [
              'nes_8000:\n',
              '    ; $8000: $A9 Lda Immediate\n',
              'nes_8002_trace:\n',
              '    ; $8002: $D0 Bne Relative\n',
              'SECTION "next", ROMX, BANK[40]\n',
          ]
          blocks = d.parse_blocks(lines)
          assert 0x8000 in blocks
          assert len(blocks[0x8000].insns) == 1, blocks[0x8000].insns
          assert blocks[0x8000].end_i == 2
          print('trace liveness boundary self-test: ok')
          PY
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --all-targets
      - name: Check
        run: cargo check --all-targets
      - name: Generate synthetic NES ROM
        run: python3 tools/make_smoke_rom.py /tmp/nes2gbc-smoke.nes
      - name: Recompile generated ASM
        run: make generate ROM=/tmp/nes2gbc-smoke.nes MAX_BLOCKS=16
      - name: Reject duplicate generated labels
        run: |
          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          labels=[]
          for line in Path('runtime/generated.asm').read_text().splitlines():
              m=re.match(r'^\s*([A-Za-z_][A-Za-z0-9_]*):\s*$', line)
              if m:
                  labels.append(m.group(1))
          dup=[k for k,v in Counter(labels).items() if v>1]
          assert not dup, f'duplicate labels: {dup[:20]}'
          print('duplicate-label scan: ok')
          PY
      - name: Assemble generated GBC ROM with RGBDS
        run: docker run --rm -v "$PWD/runtime:/work" -w /work ghcr.io/gbdev/rgbds:latest make
      - name: Commit source fix and remove helper/workflow
        run: |
          git add tools/dead_terminal_zn.py tools/lazy_overflow_updates.py
          git commit -m "Treat private trace entries as liveness boundaries"
          git push origin HEAD:perf/branch-fusion
