name: Temporary superblock compare patch

on:
  push:
    branches: [perf/branch-fusion]
    paths: [.github/workflows/zz-superblock-compare-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/branch-fusion
          fetch-depth: 0
      - name: Patch stateful compare emission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/state_superblock.rs')
          s = p.read_text()

          old = '''    fast_ops: usize,
    barriers: usize,
    canonical_adapters: usize,
}'''
          new = '''    fast_ops: usize,
    fast_compares: usize,
    barriers: usize,
    canonical_adapters: usize,
}'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        IrOp::Logic { rhs: Operand::Immediate(_), .. } => true,
        IrOp::Modify { op: ModifyOp::Inc | ModifyOp::Dec, target: ModifyTarget::Accumulator } => true,'''
          new = '''        IrOp::Logic { rhs: Operand::Immediate(_), .. } => true,
        IrOp::Compare { reg, rhs } => reg != Register::Sp && fast_operand_supported(rhs),
        IrOp::Modify { op: ModifyOp::Inc | ModifyOp::Dec, target: ModifyTarget::Accumulator } => true,'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        IrOp::Modify { op: modify, target } => {
            match target {
                ModifyTarget::Accumulator => {
                    writeln!(out, "    ldh a, [nes_a]").unwrap();
                    writeln!(out, "    {} a", if modify == ModifyOp::Inc { "inc" } else { "dec" }).unwrap();
                    writeln!(out, "    ldh [nes_a], a").unwrap();
                    emit_update_nz(out);
                }
                ModifyTarget::Memory(mem) => {
                    emit_operand_load(out, mem, state, stats);
                    writeln!(out, "    {} a", if modify == ModifyOp::Inc { "inc" } else { "dec" }).unwrap();
                    emit_update_nz(out);
                    emit_operand_store(out, mem, state, stats);
                }
            }
        }
        IrOp::Nop => {}'''
          new = '''        IrOp::Modify { op: modify, target } => {
            match target {
                ModifyTarget::Accumulator => {
                    writeln!(out, "    ldh a, [nes_a]").unwrap();
                    writeln!(out, "    {} a", if modify == ModifyOp::Inc { "inc" } else { "dec" }).unwrap();
                    writeln!(out, "    ldh [nes_a], a").unwrap();
                    emit_update_nz(out);
                }
                ModifyTarget::Memory(mem) => {
                    emit_operand_load(out, mem, state, stats);
                    writeln!(out, "    {} a", if modify == ModifyOp::Inc { "inc" } else { "dec" }).unwrap();
                    emit_update_nz(out);
                    emit_operand_store(out, mem, state, stats);
                }
            }
        }
        IrOp::Compare { reg, rhs } => {
            match rhs {
                Operand::Immediate(imm) => {
                    writeln!(out, "    ld e, ${imm:02X}").unwrap();
                }
                _ => {
                    emit_operand_load(out, rhs, state, stats);
                    writeln!(out, "    ld e, a ; superblock compare RHS").unwrap();
                }
            }
            match reg {
                Register::A => writeln!(out, "    ldh a, [nes_a]").unwrap(),
                Register::X => {
                    ensure_x(out, state, stats);
                    writeln!(out, "    ld a, b ; superblock compare cached X").unwrap();
                    stats.x_reload_avoided += 1;
                }
                Register::Y => {
                    ensure_y(out, state, stats);
                    writeln!(out, "    ld a, c ; superblock compare cached Y").unwrap();
                    stats.y_reload_avoided += 1;
                }
                Register::Sp => unreachable!(),
            }
            // 6502 CMP/CPX/CPY: C is set when lhs >= rhs; Z/N follow lhs-rhs.
            // Do this inline so B/C residency survives the comparison.
            writeln!(out, "    sub e ; superblock fast compare").unwrap();
            writeln!(out, "    ldh [nes_z_shadow], a").unwrap();
            writeln!(out, "    ldh [nes_n_shadow], a").unwrap();
            writeln!(out, "    ld a, $00").unwrap();
            writeln!(out, "    jr c, :+").unwrap();
            writeln!(out, "    inc a").unwrap();
            writeln!(out, ":").unwrap();
            writeln!(out, "    ldh [nes_c_shadow], a").unwrap();
            stats.fast_compares += 1;
        }
        IrOp::Nop => {}'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        "superblock-state: avoided {} X + {} Y HRAM reload(s); deferred {} X + {} Y canonical store(s); materialized {} X + {} Y at barriers/side exits; cached indexed uses X={} Y={}; seeds X={} Y={}; fast ops {}; barriers {}; canonical adapters {}",'''
          new = '''        "superblock-state: avoided {} X + {} Y HRAM reload(s); deferred {} X + {} Y canonical store(s); materialized {} X + {} Y at barriers/side exits; cached indexed uses X={} Y={}; seeds X={} Y={}; fast ops {} ({} compares); barriers {}; canonical adapters {}",'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        stats.fast_ops,
        stats.barriers,
        stats.canonical_adapters,'''
          new = '''        stats.fast_ops,
        stats.fast_compares,
        stats.barriers,
        stats.canonical_adapters,'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    fn multiply_reached_target_is_not_internalized() {
        let mut prg = vec![0xEA; 0x8000];
        prg[0..8].copy_from_slice(&[0xD0, 0x03, 0x4C, 0x05, 0x80, 0xA9, 0x01, 0x60]);
        let graph = cfg::discover(0, &prg, &[0x8000]).unwrap();
        let selected: BTreeSet<u16> = graph.blocks.keys().copied().collect();
        let banks = assign_code_banks(&graph, &selected);
        let polls = nmi_poll_points(&graph, &selected);
        let plan = plan_superblocks(&graph, &selected, &banks, &polls);
        assert!(!plan.next.values().any(|&target| target == 0x8005));
    }
}'''
          new = '''    fn multiply_reached_target_is_not_internalized() {
        let mut prg = vec![0xEA; 0x8000];
        prg[0..8].copy_from_slice(&[0xD0, 0x03, 0x4C, 0x05, 0x80, 0xA9, 0x01, 0x60]);
        let graph = cfg::discover(0, &prg, &[0x8000]).unwrap();
        let selected: BTreeSet<u16> = graph.blocks.keys().copied().collect();
        let banks = assign_code_banks(&graph, &selected);
        let polls = nmi_poll_points(&graph, &selected);
        let plan = plan_superblocks(&graph, &selected, &banks, &polls);
        assert!(!plan.next.values().any(|&target| target == 0x8005));
    }

    #[test]
    fn compare_keeps_dirty_x_resident_until_real_control_barrier() {
        let mut prg = vec![0xEA; 0x8000];
        // LDX #$04 / CPX #$03 / BNE $8008 / NOP / NOP / RTS / RTS.
        prg[0..9].copy_from_slice(&[0xA2, 0x04, 0xE0, 0x03, 0xD0, 0x02, 0xEA, 0x60, 0x60]);
        let graph = cfg::discover(0, &prg, &[0x8000]).unwrap();
        let asm = emit_cfg_with_interrupts(
            &graph,
            EmitOptions { reset: 0x8000, max_blocks: Some(8), debug_trace: false },
            0x8000,
            0x8000,
        );
        let compare = asm.find("; $8002: $E0 Cpx Immediate").unwrap();
        let branch = asm.find("; $8004: $D0 Bne Relative").unwrap();
        let between = &asm[compare..branch];
        assert!(between.contains("superblock compare cached X"));
        assert!(between.contains("superblock fast compare"));
        assert!(!between.contains("superblock materialize X"));
    }
}'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          cargo fmt --all
          cargo test --all-targets
          cargo check --all-targets
          git config user.name 'nes2gbc-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/state_superblock.rs
          git rm .github/workflows/zz-superblock-compare-patch.yml
          git commit -m 'Keep XY resident across compare instructions'
          git push origin HEAD:perf/branch-fusion
