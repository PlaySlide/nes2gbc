name: Cleanup merge smoke artifacts
on:
  push:
    branches:
      - apu/correctness-pass-2
    paths:
      - .github/workflows/cleanup-merge-artifacts.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore generated files and commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout 6b121c7bf93cae501b63f704b10a3a8328e5a51d -- runtime/generated.asm
          git rm -f --ignore-unmatch Cargo.lock runtime/build/runtime.o runtime/generated.chr.bin runtime/generated.chr.gbc.bin runtime/generated.prg.bin
          rm -f .github/workflows/cleanup-merge-artifacts.yml
          git add -A
          git commit -m "Remove merge smoke-build artifacts"
          git push origin HEAD:apu/correctness-pass-2
