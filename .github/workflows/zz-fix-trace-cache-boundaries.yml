name: Fix trace cache boundaries

on:
  push:
    branches:
      - perf/branch-fusion
    paths:
      - .github/workflows/zz-fix-trace-cache-boundaries.yml

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/branch-fusion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Treat private trace labels as cache block boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('tools/cache_a_in_blocks.py'),
              Path('tools/cache_xy_in_blocks.py'),
              Path('tools/cache_hot_zp_in_blocks.py'),
          ]
          old = 'BLOCK_RE = re.compile(r"^nes_([0-9A-Fa-f]{4}):$")'
          new = 'BLOCK_RE = re.compile(r"^nes_([0-9A-Fa-f]{4})(?:_trace)?:$")'
          for p in files:
              s = p.read_text()
              assert old in s, f'missing expected BLOCK_RE in {p}'
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Cache-boundary self-test
        run: |
          python3 - <<'PY'
          import runpy
          samples = [
              'nes_8000:\n',
              '    ld a, $01\n',
              'nes_8010_trace:\n',
              '    ld a, $02\n',
              'nes_8020:\n',
              '    ret\n',
          ]
          for path in ['tools/cache_a_in_blocks.py','tools/cache_xy_in_blocks.py','tools/cache_hot_zp_in_blocks.py']:
              ns = runpy.run_path(path)
              bs = ns['blocks'](samples)
              assert [b.addr for b in bs] == [0x8000,0x8010,0x8020], (path, bs)
              print(path, 'trace-boundary self-test: ok')
          PY
      - name: Test
        run: cargo test --all-targets
      - name: Check
        run: cargo check --all-targets
      - name: Generate synthetic NES ROM
        run: python3 tools/make_smoke_rom.py /tmp/nes2gbc-smoke.nes
      - name: Recompile generated ASM
        run: make generate ROM=/tmp/nes2gbc-smoke.nes MAX_BLOCKS=16
      - name: Reject duplicate generated labels
        run: |
          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          labels=[]
          for line in Path('runtime/generated.asm').read_text().splitlines():
              m=re.match(r'^\s*([A-Za-z_][A-Za-z0-9_]*):\s*$', line)
              if m:
                  labels.append(m.group(1))
          dup=[k for k,v in Counter(labels).items() if v>1]
          assert not dup, f'duplicate labels: {dup[:20]}'
          print('duplicate-label scan: ok')
          PY
      - name: Assemble generated GBC ROM with RGBDS
        run: docker run --rm -v "$PWD/runtime:/work" -w /work ghcr.io/gbdev/rgbds:latest make
      - name: Commit source fix and remove workflow
        run: |
          rm -f .github/workflows/zz-fix-trace-cache-boundaries.yml
          git add -A
          git commit -m "Treat private trace entries as cache boundaries"
          git push origin HEAD:perf/branch-fusion
