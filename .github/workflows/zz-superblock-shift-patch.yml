name: Apply stateful shift patch

on:
  push:
    branches: [perf/branch-fusion]
    paths: [.github/workflows/zz-superblock-shift-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run stateful shift emitter patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/branch-fusion
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply and verify stateful shifts
        shell: bash
        run: |
          python3 tools/tmp_patch_stateful_shifts.py
          cargo fmt --all
          cargo test --all-targets
          cargo check --all-targets
          python3 tools/make_smoke_rom.py /tmp/nes2gbc-smoke.nes
          make generate ROM=/tmp/nes2gbc-smoke.nes MAX_BLOCKS=16
          docker run --rm -v "$PWD/runtime:/work" -w /work ghcr.io/gbdev/rgbds:latest make
          test -s runtime/build/runtime.gbc
          git config user.name nes2gbc-bot
          git config user.email actions@users.noreply.github.com
          git add src/state_superblock.rs
          git commit -m 'Keep XY resident across shifts and rotates'
          git push origin HEAD:perf/branch-fusion
