name: Apply generic APU cleanup

on:
  push:
    branches:
      - apu/correctness-pass-2
    paths:
      - tools/apply_apu_generic_cleanup.py
      - .github/workflows/apply-apu-generic-cleanup.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apu/correctness-pass-2
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply generic APU cleanup
        run: python3 tools/apply_apu_generic_cleanup.py

      - name: Ensure game-specific APU hacks are gone
        run: |
          ! grep -Ein 'SMB|flagpole|fireball|death music|head-bump|blast-style|octave cap|Jump/SFX' runtime/apu.asm
          ! grep -Ein 'sweep_active|sweep_muted|sweep_start|sweep_last|last_nr12|prev_4015' runtime/apu.asm

      - name: Rust tests
        run: cargo test --all-targets

      - name: Rust check
        run: cargo check --all-targets

      - name: End-to-end RGBDS build
        run: |
          python3 tools/make_smoke_rom.py /tmp/nes2gbc-smoke.nes
          cargo run -- /tmp/nes2gbc-smoke.nes --emit-asm runtime/generated.asm --max-blocks 16
          docker run --rm -v "$PWD/runtime:/work" -w /work ghcr.io/gbdev/rgbds:latest make clean all
          test -s runtime/build/runtime.gbc

      - name: Commit source change and remove one-shot helpers
        run: |
          rm -f tools/apply_apu_generic_cleanup.py .github/workflows/apply-apu-generic-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/apu.asm tools/apply_apu_generic_cleanup.py .github/workflows/apply-apu-generic-cleanup.yml
          git commit -m 'Replace game-tuned APU behavior with generic NES semantics'
          git push origin HEAD:apu/correctness-pass-2
