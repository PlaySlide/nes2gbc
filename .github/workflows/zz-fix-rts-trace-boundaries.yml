name: Fix RTS trace boundaries

on:
  push:
    branches:
      - perf/branch-fusion
    paths:
      - .github/workflows/zz-fix-rts-trace-boundaries.yml

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/branch-fusion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply RTS trace-boundary fix
        run: python3 tools/apply_rts_trace_boundaries.py
      - name: RTS parser self-test
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          import fast_leaf_rts_dispatch as leaf
          import fast_subroutine_rts_dispatch as sub
          import defer_subroutine_rts_increment as inc

          lines = [
              'SECTION "trace", ROMX, BANK[40]\n',
              'nes_8000:\n',
              '    ; $8000: $A9 Lda Immediate\n',
              'nes_8002_trace:\n',
              '    ; $8002: $60 Rts Implied\n',
              '    inc hl\n',
              '    jp nes_dispatch_hl\n',
              'SECTION "adapter", ROMX, BANK[40]\n',
              'nes_8002:\n',
              '    jp nes_8002_trace\n',
          ]
          for mod in (leaf, sub):
              blocks, banks = mod.parse_blocks(lines)
              assert [i[1] for i in blocks[0x8000].insns] == [0x8000]
              assert [i[1] for i in blocks[0x8002].insns] == [0x8002]
              assert banks[0x8002] == 40
          scan = [
              '    inc hl\n',
              '    ; guarded multi-block RTS return fast path\n',
              'nes_9000_trace:\n',
              '    jp nes_dispatch_hl\n',
          ]
          assert inc.find_fallback(scan, 1) is None
          print('RTS trace-boundary self-test: ok')
          PY
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --all-targets
      - name: Check
        run: cargo check --all-targets
      - name: Generate synthetic NES ROM
        run: python3 tools/make_smoke_rom.py /tmp/nes2gbc-smoke.nes
      - name: Recompile generated ASM
        run: make generate ROM=/tmp/nes2gbc-smoke.nes MAX_BLOCKS=16
      - name: Reject duplicate generated labels
        run: |
          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          labels=[]
          for line in Path('runtime/generated.asm').read_text().splitlines():
              m=re.match(r'^\s*([A-Za-z_][A-Za-z0-9_]*):\s*$', line)
              if m:
                  labels.append(m.group(1))
          dup=[k for k,v in Counter(labels).items() if v>1]
          assert not dup, f'duplicate labels: {dup[:20]}'
          print('duplicate-label scan: ok')
          PY
      - name: Assemble generated GBC ROM with RGBDS
        run: docker run --rm -v "$PWD/runtime:/work" -w /work ghcr.io/gbdev/rgbds:latest make
      - name: Commit source fix
        run: |
          git add tools/fast_leaf_rts_dispatch.py tools/fast_subroutine_rts_dispatch.py tools/defer_subroutine_rts_increment.py
          git commit -m "Treat private trace entries as RTS boundaries"
          git push origin HEAD:perf/branch-fusion
